[package]
name = "maskwars-house"
version = "1.2.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/plavutskyi/mask-wars"
description = "MASK WARS house: the daily round's seven steps on the house's own account, for a key that can sign nothing else."

[lib]
crate-type = ["cdylib", "rlib"]

# The contract speaks to NEAR through its host functions directly, with no SDK: the code is what the house's account
# locks NEAR for (1 NEAR per 100 KB), and the house has little to spare. Off wasm the crate is its rules alone, tested
# natively; the real node runs it in contracts/challenges/runner/tests/house.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
near-sys = "0.4"

# The build anyone can repeat: `cargo near build reproducible-wasm` runs this command in this image, and the code it
# gives names the image, the command, the commit and this folder in `contract_source_metadata` (build.rs). With no
# near-sdk there is no SDK release for cargo-near to read the protocol from, so it is told not to check the toolchain:
# rust-toolchain.toml pins the same 1.97.0 as the image, the one the code on mainnet was built with.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.0"
image_digest = "sha256:b193c8640a27172f83136a0f0aab2a9bf9d09f6ba0e6afd187addfaa9b92bae0"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi", "--skip-rust-version-check"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
