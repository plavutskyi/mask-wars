[package]
name = "masks-sandbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The mask factory in a real local NEAR sandbox: forge, race keys, the mind's tab, winnings."

[dependencies]
anyhow = "1"
near-workspaces = "0.24"
near-sandbox = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
maskwars-brain = { path = "../../../services/brain" }
