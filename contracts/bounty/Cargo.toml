[package]
name = "maskwars-bounty"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "MASK WARS bounty: a team locks NEAR, a judge on OutLayer confirms the break, the contract pays the winning mask."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
