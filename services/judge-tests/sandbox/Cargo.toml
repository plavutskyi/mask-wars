[package]
name = "job-judges-sandbox"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "The job judges against the real jobs contract in a local NEAR sandbox: open to settle with the judge's own verdict, and the attacks."

[dependencies]
anyhow = "1"
jobs-sandbox = { path = "../../../contracts/jobs/sandbox" }
maskwars-judge-tests = { path = ".." }
near-workspaces = "0.24"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
wasmi = "2"
wat = "1"
