[package]
name = "maskwars-season"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "MASK WARS season treasury: holds the sponsors' NEAR and opens a sealed round on schedule, each on a fresh safe from global code."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
