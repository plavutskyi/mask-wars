name: Season

# The show on schedule, with nobody signing for it. Every day in prime time the scheduler opens the season's next round
# on testnet, and the masks race it at once.
#
# 1. `open`: the scheduler signs one call, `open_next` on the season treasury (contracts/season), with its
#    function-call key (SCHEDULER_KEY, a secret of the `season` environment, which only `main` deploys to: a run from
#    any other branch never sees it). That key reaches nothing else and attaches no NEAR. The treasury decides
#    the target, the masks, the bounty and the safe's NEAR from its program, opens nothing that is not due or not
#    within its limits, and in the same transaction makes the round's safe from global code and opens the sealed round
#    on the bounty contract.
# 2. `race`: `Live race` on the round that opened: the masks race the target in the sandbox, the winner seals its plan,
#    plays it on the real safe, reveals it and claims; the contract pays it.
#
# GitHub starts scheduled runs a few minutes late: the cron sits just after the treasury's 18:00 UTC slot, and a late
# run still opens the slot it missed. A round already open for the slot and still sealing is raced as it is. A run
# when nothing is due opens nothing and stays green; a slot that was due and got no round turns it red.
#
# The schedule runs only once the owner has set the repository variable SEASON_LIVE to `true`, after the treasury,
# the scheduler's key and the masks' keys are on chain. Until then only a run by hand does anything. `open` also brings
# finished rounds home first (`collect`): a round nobody won sends its bounty and its safe's NEAR back to the treasury.

on:
  schedule:
    - cron: "4 18 * * *"
  workflow_dispatch:

# The network every job reads and signs on: the repository variable MASKWARS_NETWORK, testnet unless it says mainnet.
# The accounts, the RPC and OutLayer come from packages/network/<network>.json; a variable below that names an account
# of the other network stops the job before it signs anything (packages/race/src/net.ts).
env:
  MASKWARS_NETWORK: ${{ vars.MASKWARS_NETWORK || 'testnet' }}

# The token every job gets reads the code and nothing else. Actions are pinned to a commit, not a movable tag.
permissions:
  contents: read

# One season run at a time: a second one waits instead of racing the same round.
concurrency:
  group: season
  cancel-in-progress: false

jobs:
  open:
    if: github.event_name == 'workflow_dispatch' || vars.SEASON_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The scheduler's key lives in this environment, not in the repository: Deployment branches `main` only, and no
    # required reviewers, or the daily run would wait past its commit window. On mainnet: `season-mainnet`, the same.
    environment: ${{ vars.MASKWARS_NETWORK == 'mainnet' && 'season-mainnet' || 'season' }}
    outputs:
      bounty: ${{ steps.open.outputs.bounty }}
      challenge: ${{ steps.open.outputs.challenge }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # season-open.ts reads the network from @maskwars/network. No cache from other runs, and no install script runs
      # on a runner that holds the scheduler's key.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @maskwars/race...
      - name: Open the round that is due
        id: open
        env:
          SEASON: ${{ vars.MASKWARS_NETWORK != 'mainnet' && vars.SEASON_ACCOUNT || '' }}
          SCHEDULER: ${{ vars.MASKWARS_NETWORK != 'mainnet' && vars.SCHEDULER_ACCOUNT || '' }}
          SCHEDULER_KEY: ${{ secrets.SCHEDULER_KEY }}
        run: node packages/race/scripts/season-open.ts

  race:
    needs: open
    if: needs.open.outputs.bounty != ''
    uses: ./.github/workflows/live-race.yml
    with:
      challenge: ${{ needs.open.outputs.challenge }}
      bounty: ${{ needs.open.outputs.bounty }}
      attempts: "5"
      live: true
    # The race job's one secret. The masks' keys reach only the drain job, through its `live-race` environment.
    secrets:
      NEAR_AI_API_KEY: ${{ secrets.NEAR_AI_API_KEY }}
