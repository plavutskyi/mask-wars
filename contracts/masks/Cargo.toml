[workspace]
resolver = "2"
members = ["mask", "factory", "stub", "sandbox", "legacy/factory-v1", "legacy/mask-v1"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/plavutskyi/mask-wars"

[workspace.dependencies]
near-sdk = "5.30"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
