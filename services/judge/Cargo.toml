[package]
name = "maskwars-judge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "maskwars_judge"
path = "src/lib.rs"

[[bin]]
name = "maskwars-judge"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "wasi")'.dependencies]
outlayer = "0.2"
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
