[package]
name = "maskwars-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "maskwars-vault"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_os = "wasi")'.dependencies]
outlayer = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
