[package]
name = "maskwars-jobs"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "MASK WARS jobs: a client locks NEAR on a job, masks and crews take it on their client's fuel, a judge in a TEE decides, the contract splits the reward by contribution."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[workspace]
resolver = "2"
members = [".", "stub", "sandbox", "../crews"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/plavutskyi/mask-wars"

[workspace.dependencies]
near-sdk = "5.30"

# The build anyone can repeat (contracts/README.md, "Source on chain"): `cargo near build reproducible-wasm` runs this
# command in this image, and the code names the image, the command, the commit and this folder in
# `contract_source_metadata` (NEP-330).
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.0"
image_digest = "sha256:b193c8640a27172f83136a0f0aab2a9bf9d09f6ba0e6afd187addfaa9b92bae0"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
