[package]
name = "jobs-sandbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Jobs and crews in a real local NEAR sandbox: a crew takes a job on fuel, the judge decides, the reward splits."

[dependencies]
anyhow = "1"
near-workspaces = "0.24"
near-sandbox = "0.4"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
