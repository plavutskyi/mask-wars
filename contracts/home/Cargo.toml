[package]
name = "maskwars-home"
version = "1.1.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/plavutskyi/mask-wars"
description = "MASK WARS home: a mask's winnings above what it keeps go back to the house, and only there."

[lib]
crate-type = ["cdylib"]

# The house is part of the code: each network has its own build, and a build names exactly one.
[features]
mainnet = []
testnet = []

# The build anyone can repeat: `cargo near build reproducible-wasm` (mainnet) and `--variant testnet` run these
# commands in this image, and the code names the image, the command, the commit and this folder in
# `contract_source_metadata` (build.rs). With no near-sdk there is no SDK release for cargo-near to read the protocol
# from, so it is told not to check the toolchain: rust-toolchain.toml pins the same 1.97.0 as the image, the one the
# code on mainnet was built with.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.0"
image_digest = "sha256:b193c8640a27172f83136a0f0aab2a9bf9d09f6ba0e6afd187addfaa9b92bae0"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi", "--skip-rust-version-check", "--features", "mainnet"]

[package.metadata.near.reproducible_build.variant.testnet]
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi", "--skip-rust-version-check", "--features", "testnet"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
